# Render an episode (tools/episode.mjs, CLAUDE.md override 8) on a clean
# runner and file it as the Release film-ep-<slug>.
#
# The owner's footage arrives the same way the films leave: as assets on a
# GitHub Release, here footage-<slug>, named as the script's sheet says
# (source/episodes/FORMAT.md). Drag them onto the release in the browser;
# nothing is committed, no service is paid, and the render can start from a
# phone. Shots still missing render as slates, so the first run is the
# animatic and each later run fills more of it in.
#
# Dispatch with the episode's slug (the file source/episodes/<slug>.md on the
# ref being run). It no longer runs on a push of this file (2026-10-17): the
# voice is Gemini's free tier, ten requests a day, and a proof render of a
# draft episode spent them; every chunk it speaks is cached under
# narration-ep-<slug>, and a run stopped by the quota ends green, files
# nothing, and continues on the next dispatch. The result is the artifact film-ep-<slug>-wide and the
# Release film-ep-<slug> (release.yml): film, captions, thumbnail, meta and
# the upload sheet, plus shots.md, the list of what is still missing.
#
# The channel (tools/upload-youtube.mjs): when the repository holds
# YT_CLIENT_ID, YT_CLIENT_SECRET and YT_REFRESH_TOKEN (minted once with
# tools/youtube-auth.mjs) a dispatched run ends on YouTube. Without video_id it
# uploads the film and the Short, private by default; YouTube keeps API
# uploads private anyway until the project passes its API compliance audit.
# With video_id (a video the owner uploaded by hand in Studio) it sets that
# video's generated title, description, chapters, captions and thumbnail
# instead, which the audit does not lock. A push never uploads, and without
# the secrets the step is skipped.
name: episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Episode slug: the file source/episodes/<slug>.md'
        required: true
      music:
        description: 'bed (computed), none, or leave as bed'
        required: false
        default: bed
      upload:
        description: 'With the YouTube secrets set: no, film (the film and the Short), or update (needs video_id)'
        required: false
        default: film
      privacy:
        description: 'Privacy for a new upload: private, unlisted or public'
        required: false
        default: private
      video_id:
        description: 'For upload=update: the id of the video uploaded by hand'
        required: false
        default: ''

# One voice for every step: the Short re-narrated in Kokoro when only the Render step carried it (review, 2026-10-17).
env:
  NARRATOR: ${{ vars.NARRATOR || 'gemini:voice_l6lephk1pqjk' }}

concurrency:
  group: episode-${{ github.ref }}-${{ inputs.slug || 'softbank-975' }}
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      quota: ${{ steps.render.outputs.quota }}
    env:
      SLUG: ${{ inputs.slug || 'softbank-975' }}
      MUSIC: ${{ inputs.music || 'bed' }}
      GH_TOKEN: ${{ github.token }}
      UPLOAD: ${{ inputs.upload || 'no' }}
      PRIVACY: ${{ inputs.privacy || 'private' }}
      VIDEO_ID: ${{ inputs.video_id }}
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      - name: Install Playwright, ffmpeg, espeak-ng
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng

      # Facts first: a script that fails the check is not rendered.
      - name: Check
        run: node tools/episode.mjs check "source/episodes/$SLUG.md" --online

      - name: Fetch the footage
        run: |
          mkdir -p "brand/youtube/ep-$SLUG/footage"
          if gh release view "footage-$SLUG" >/dev/null 2>&1; then
            gh release download "footage-$SLUG" -D "brand/youtube/ep-$SLUG/footage" --clobber
            ls -la "brand/youtube/ep-$SLUG/footage"
          else
            echo "::notice::no release footage-$SLUG yet; every owner shot renders as a slate"
          fi

      # Every chunk Gemini already spoke for this episode (tools/narrate_gemini.py, THE CACHE AND THE QUOTA).
      - name: Narration cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aedificare-narration
          key: narration-ep-${{ env.SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: narration-ep-${{ env.SLUG }}-

      # Exit 75 is the day's Gemini quota: the run ends green with a warning, files nothing, and a rerun continues.
      - name: Render
        id: render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.cache/aedificare-narration
          export NARRATION_CACHE=~/.cache/aedificare-narration
          set +e
          node tools/episode.mjs all "source/episodes/$SLUG.md" --music "$MUSIC"
          s=$?
          if [ "$s" -eq 75 ]; then
            echo "quota=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the day's Gemini quota ran out; the chunks so far are cached and a rerun continues"
            exit 0
          fi
          exit "$s"

      - name: Keep the narration cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aedificare-narration
          key: narration-ep-${{ env.SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The Short: the chapters named in the script's short:, tall, from the same narration.
      - name: Short
        if: steps.render.outputs.quota != 'true'
        run: node tools/episode.mjs render "source/episodes/$SLUG.md" --music "$MUSIC" --short

      # Skipped on a push, without the secrets, or with upload=no. Nothing goes public unless asked for.
      - name: To YouTube
        if: env.HAS_YT == 'true' && env.UPLOAD != 'no' && steps.render.outputs.quota != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
        run: |
          D="brand/youtube/ep-$SLUG"
          if [ "$UPLOAD" = update ]; then
            [ -n "$VIDEO_ID" ] || { echo "::error::upload=update needs video_id"; exit 1; }
            node tools/upload-youtube.mjs "$D/meta.json" --update "$VIDEO_ID"
          else
            for m in meta.json meta-short.json; do
              if [ -f "$D/$m" ]; then node tools/upload-youtube.mjs "$D/$m" --privacy "$PRIVACY"; fi
            done
          fi

      - name: Upload the film
        if: steps.render.outputs.quota != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: film-ep-${{ env.SLUG }}-wide
          path: |
            brand/youtube/ep-${{ env.SLUG }}/*.mp4
            brand/youtube/ep-${{ env.SLUG }}/*.srt
            brand/youtube/ep-${{ env.SLUG }}/*.txt
            brand/youtube/ep-${{ env.SLUG }}/*.json
            brand/youtube/ep-${{ env.SLUG }}/*.png
            brand/youtube/ep-${{ env.SLUG }}/*.md
          retention-days: 90
          compression-level: 0

  release:
    needs: episode
    if: needs.episode.outputs.quota != 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
    with:
      slug: ep-${{ inputs.slug || 'softbank-975' }}
      run_id: ${{ github.run_id }}
