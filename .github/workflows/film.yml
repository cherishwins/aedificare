# Render a narrated film on a clean runner and keep it as an artifact.
#
# The build sandbox that renders films is ephemeral and can hand back at most
# 30 MB; a 14-minute 1080p film is a gigabyte. A public repo's Actions minutes
# are free and unmetered and its artifacts are free, so this is where a film
# is made for real: dispatch it with an edition's slug, wait (about an hour:
# the voice runs on CPU, the frames run at 24 a second through Chromium),
# download brand/youtube/<slug> from the run's Artifacts. It is the first
# half of the publish pipeline in CLAUDE.md, Open 9; the second half, the
# upload through the YouTube Data API, waits on the owner's OAuth client.
#
# Also runs once when this file itself changes, so the workflow is proved on
# the branch that changes it and not trusted on faith.
#
# The second half: when the repository holds YT_CLIENT_ID, YT_CLIENT_SECRET
# and YT_REFRESH_TOKEN (tools/youtube-auth.mjs mints the token once), the
# film and its Short are uploaded to the channel as PRIVATE, with captions
# and thumbnail, and the owner presses Publish in Studio after watching.
# Without the secrets the upload step is skipped and the artifact is all.
name: film

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Edition slug (edition-03, ns-02, ns-01, edition-01, the-floor)'
        required: true
        default: edition-03
      format:
        description: 'wide (1920x1080) or tall (1080x1920)'
        required: false
        default: wide
      privacy:
        description: 'YouTube privacy for the upload, when the secrets exist'
        required: false
        default: private
        type: choice
        options: [private, unlisted, public]
  push:
    paths: ['.github/workflows/film.yml']

concurrency:
  group: film-${{ github.ref }}-${{ inputs.slug || 'edition-03' }}
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SLUG: ${{ inputs.slug || 'edition-03' }}
      FORMAT: ${{ inputs.format || 'wide' }}
      PRIVACY: ${{ inputs.privacy || 'private' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # Playwright stays out of package.json (CLAUDE.md, Stack); the tools
      # resolve it by name when it is installed this way.
      - name: Install Playwright, ffmpeg, espeak-ng
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng

      # The script is walked out of the BUILT page, so the build comes first;
      # it also runs the checkers.
      - name: Build
        run: npm run build

      - name: Film
        run: node tools/generate-film.mjs --slug "$SLUG" --format "$FORMAT"

      # The Short reuses the narration: section 00 and the record, tall.
      - name: Short
        run: node tools/generate-film.mjs --slug "$SLUG" --step render --short

      # Skipped without the secrets. Private by default; nothing goes public from a machine.
      - name: Upload to YouTube
        if: env.YT_REFRESH_TOKEN != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
        run: |
          node tools/upload-youtube.mjs "brand/youtube/$SLUG/meta.json" --privacy "$PRIVACY"
          node tools/upload-youtube.mjs "brand/youtube/$SLUG/meta-short.json" --privacy "$PRIVACY"

      - name: Upload the film
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ env.SLUG }}-${{ env.FORMAT }}
          path: brand/youtube/${{ env.SLUG }}
          retention-days: 90
          compression-level: 0
