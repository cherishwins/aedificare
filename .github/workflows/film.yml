# Render a narrated film on a clean runner and keep it as an artifact.
#
# The build sandbox that renders films is ephemeral and can hand back at most
# 30 MB; a 14-minute 1080p film is a gigabyte. A public repo's Actions minutes
# are free and unmetered and its artifacts are free, so this is where a film
# is made for real: dispatch it with an edition's slug, wait (about an hour:
# the frames run at 24 a second through Chromium), download
# brand/youtube/<slug> from the run's Artifacts. It is the first half of the
# publish pipeline in CLAUDE.md, Open 9.
#
# The render is filed as a permanent Release named film-<slug>
# (release.yml), which is where the owner finds a film: the artifact is the
# 90-day backup. The upload is youtube.yml's (action=upload), which takes
# every render on Releases that is not on the channel yet and files the
# video's id back on its release. This workflow used to upload too, gated on
# `env.YT_REFRESH_TOKEN` in the step's own `if`, where the step's own env
# is not yet set, so it never ran; one uploader with a ledger replaced it
# (2026-10-17).
#
# The voice is ElevenLabs' on the owner's paid plan (CLAUDE.md, override 6 as
# amended); its limit is the month's credits. Every block or chunk the voice
# speaks is kept in the Actions cache under narration-<slug>, and a rerun pays
# only for what it has not heard; when the credits (or, on the Gemini engine,
# the day's quota) run out the narration stops with exit 75, this run ends
# green with a warning and files nothing, and the next run continues.
# It no longer runs on a push of this file: that rendered The Markup on every
# edit and spent a day's quota proving the workflow. Called by film-queue.yml
# with skip_voiced, it does nothing for an edition whose release already
# carries the voice it would speak in.
name: film

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Edition slug, as in src/lib/editions.mjs'
        required: true
        default: edition-03
      format:
        description: 'wide (1920x1080) or tall (1080x1920)'
        required: false
        default: wide
  workflow_call:
    inputs:
      slug:
        type: string
        required: true
      format:
        type: string
        default: wide
      skip_voiced:
        description: 'Do nothing when the release film-<slug> is already in this voice'
        type: boolean
        default: false

env:
  NARRATOR: ${{ vars.NARRATOR }}  # empty: the channel's voice from src/config.mjs

jobs:
  # Skip only when the release is a complete upload in the channel's voice: meta.json goes up last and only over a
  # complete set (release.yml), so its description naming the voice, and the film it names being on the release,
  # mean done. The same test the upload guard applies (tools/youtube-channel.mjs). A gh error is never "done".
  voiced:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src/config.mjs
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          SKIP: ${{ inputs.skip_voiced && 'yes' || 'no' }}
        run: |
          [ "$SKIP" = yes ] || exit 0
          N="${NARRATOR:-$(node --input-type=module -e "import('./src/config.mjs').then((m) => console.log(m.NARRATOR))")}"
          case "$N" in gemini:*) V="${N#gemini:}" ;; eleven:*) V="${N#eleven:}" ;; *) V=am_michael ;; esac
          if ! assets=$(gh release view "film-$SLUG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1); then
            if grep -q 'release not found' <<<"$assets"; then echo "no release film-$SLUG yet"; exit 0; fi
            echo "::error::could not read the release film-$SLUG: $assets"; exit 1
          fi
          grep -qx meta.json <<<"$assets" || { echo "film-$SLUG has no meta.json; rendering"; exit 0; }
          gh release download "film-$SLUG" -R "$GITHUB_REPOSITORY" -p meta.json
          film="$(jq -r .file meta.json)"
          if jq -r .description meta.json | grep -qiF -- "$V" && grep -qxF -- "$film" <<<"$assets"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::film-$SLUG is already filed in $V; nothing to render"
          else
            echo "film-$SLUG is not a complete upload in $V; rendering"
          fi

  film:
    needs: voiced
    if: needs.voiced.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Per edition, not per branch: two renders of one edition serialize, and the second restores the first's cache.
    concurrency:
      group: film-${{ inputs.slug }}
      cancel-in-progress: false
    outputs:
      quota: ${{ steps.film.outputs.quota }}
    env:
      SLUG: ${{ inputs.slug }}
      FORMAT: ${{ inputs.format || 'wide' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # Playwright stays out of package.json (CLAUDE.md, Stack); the tools
      # resolve it by name when it is installed this way.
      - name: Install Playwright, ffmpeg, espeak-ng
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng

      # The script is walked out of the BUILT page, so the build comes first;
      # it also runs the checkers.
      - name: Build
        run: npm run build

      # Every chunk already heard for this edition, from earlier runs (narrate_gemini.py, THE CACHE AND THE QUOTA).
      - name: Narration cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aedificare-narration
          key: narration-${{ env.SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: narration-${{ env.SLUG }}-

      # The channel's voice (CLAUDE.md, override 6 as amended 2026-10-17): ElevenLabs, one voice designed in the
      # owner's account, through tools/narrate_eleven.py. vars.NARRATOR overrides (gemini:<id> and kokoro still work).
      - name: Film
        id: film
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The paid ElevenLabs account's key is stored as PLUTO (the owner's name for it).
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.PLUTO }}
        run: |
          mkdir -p ~/.cache/aedificare-narration
          export NARRATION_CACHE=~/.cache/aedificare-narration
          set +e
          node tools/generate-film.mjs --slug "$SLUG" --format "$FORMAT"
          s=$?
          if [ "$s" -eq 75 ]; then
            echo "quota=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the voice's quota ran out (ElevenLabs: the month's credits; Gemini: the day's requests); the narration so far is cached and the next run after the reset continues"
            exit 0
          fi
          exit "$s"

      - name: Keep the narration cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aedificare-narration
          key: narration-${{ env.SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The Short reuses the narration: section 00 and the record, tall.
      - name: Short
        if: steps.film.outputs.quota != 'true'
        run: node tools/generate-film.mjs --slug "$SLUG" --step render --short

      - name: Upload the film
        if: steps.film.outputs.quota != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ env.SLUG }}-${{ env.FORMAT }}
          path: brand/youtube/${{ env.SLUG }}
          retention-days: 90
          compression-level: 0

  # The filing system: the same files as a permanent Release named film-<slug>.
  release:
    needs: film
    if: ${{ (inputs.format || 'wide') == 'wide' && needs.film.outputs.quota != 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
    with:
      slug: ${{ inputs.slug }}
      run_id: ${{ github.run_id }}
