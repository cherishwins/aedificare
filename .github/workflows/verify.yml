# Every check this repo relies on, run on every change. Ported from
# cherishwins/teamcanada. The repo is public, so Actions minutes are free and
# unmetered, which is the only reason this is allowed to exist under the
# zero-budget rule.
#
# It exists because a convention written in CLAUDE.md with its checker living
# in a scratch directory dies with the session. Committing the checkers fixed
# half of that. This fixes the other half: nobody has to remember to run them.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright is intentionally absent from package.json: Vercel installs
      # devDependencies to build, and a browser-automation library has no place
      # in the install path of a static site that never uses it at runtime.
      - name: Install Playwright (CI only)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      # `npm run build` also runs check-brand, check-budget and check-docs and
      # fails on a single violation.
      - name: Build
        run: npm run build

      # The film workflows run unattended (film-queue.yml at 08:20 UTC on main) and no longer prove themselves on a
      # push, so every workflow is linted here: expressions, workflow_call inputs and secrets, job outputs. actionlint
      # v1.7.7, checksum from its release; shellcheck off, as the scripts were written without it.
      - name: Lint workflows
        run: |
          curl -sSL -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  al.tgz' | sha256sum -c -
          tar xzf al.tgz actionlint
          ./actionlint -shellcheck=

      # Every film's description, plain and as a re-cut, still names the channel's voice on the line film.yml's
      # morning skip test and the upload guard read, and fits YouTube's 5,000 bytes (tools/film-meta.mjs --test).
      - name: Film descriptions
        run: node tools/film-meta.mjs --test

      # High and critical advisories fail the build unless tools/audit-allowlist.json names them, with a reason and
      # an expiry (tools/check-audit.cjs); an advisory with no patched release anywhere is the case it exists for.
      - name: Audit dependencies
        run: node tools/check-audit.cjs

      # 5 pages × 10 viewports: overflow, console errors, tap targets,
      # contrast, broken references, og:image:alt, no service worker,
      # axe-core, Acid once per surface, fonts and rose fields rendered,
      # reduced-motion stills. Exits non-zero on any of the eleven.
      - name: Sweep
        run: node tools/verify.cjs

      - name: Upload build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist
          retention-days: 3
