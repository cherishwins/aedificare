# The channel, run from GitHub. The builder dispatches this (or the owner
# presses Run workflow under Actions); the three YouTube credentials live only
# in this repository's Actions secrets, so no session, laptop or chat ever
# holds them.
#
#   action=probe   uploads a three-second clip as unlisted, reports whether
#                  YouTube locked it private (the unaudited-project lock),
#                  deletes it; run once before the first real upload
#   action=list    what is on the channel, what is rendered and not yet there
#   action=upload  each render on Releases that is not on the channel yet,
#                  oldest first, at most `max` a run, private by default;
#                  refuses drafts whose shots.md still lists missing shots;
#                  files each video's id back on its release
#   action=sync    the generated title, description, chapters, captions and
#                  thumbnail onto every matched video (including hand uploads)
#   action=retire  a video in an older voice goes private once its
#                  replacement (upload with replace=old-voice) is public,
#                  or a cut superseded by a corrected render (replace=corrected)
#   action=schedule  moves a private video's publish time, or holds it with
#                  none (set="film-edition-01:film=2026-10-22T15:00:00Z,
#                  film-edition-01:short=none"); never touches a video that
#                  is out, never makes one public
#   action=withdraw  a video found wrong after it went out goes private now
#                  (set="film-edition-01:film"); never deletes; the
#                  corrected render then goes up with upload, replace=corrected
#                  and only=<release>
#
# tools/youtube-channel.mjs does the work; .claude/skills/youtube/SKILL.md is
# how a session decides which action to run. The job summary carries the
# result, so a run is read from its page without downloading anything.
name: youtube

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'probe, list, upload, sync, retire, schedule or withdraw'
        required: true
        default: list
        type: choice
        options: [probe, list, upload, sync, retire, schedule, withdraw]
      only:
        description: 'One release (film-ns-01, film-ep-softbank-975), or empty for all'
        required: false
        default: ''
      kinds:
        description: 'upload: film,short or film or short'
        required: false
        default: 'film,short'
      max:
        description: 'upload: most videos this run (one of 100 daily uploads and about 500 of 10,000 daily units each)'
        required: false
        default: '10'
      privacy:
        description: 'upload: private or unlisted (public is never set from here)'
        required: false
        default: private
        type: choice
        options: [private, unlisted]
      publish_at:
        description: 'upload: an ISO time to have YouTube publish it (stays private until then); empty to leave publishing to Studio'
        required: false
        default: ''
      every_hours:
        description: 'upload with publish_at: hours between one scheduled video and the next (0 = all at the same time)'
        required: false
        default: '0'
      # GitHub allows 25 inputs, but the pinned actionlint enforces the old 10, so related options share an input.
      replace:
        description: 'upload: old-voice also uploads a render whose video is up in an older voice (the owner said replace it); corrected uploads the only release''s corrected render beside the video it replaces, and nothing else'
        required: false
        default: none
        type: choice
        options: [none, old-voice, corrected]
      set:
        description: 'schedule: <release>:<film|short>=<ISO time|none>; withdraw: <release>:<film|short>; comma-separated'
        required: false
        default: ''
      dry:
        description: 'upload, sync, retire, schedule or withdraw: print the plan only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' && secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' }}
    steps:
      - name: Credentials
        if: env.HAS_YT != 'true'
        run: |
          echo "::error::YT_CLIENT_ID, YT_CLIENT_SECRET and YT_REFRESH_TOKEN are not all set in Settings → Secrets and variables → Actions (tools/youtube-auth.mjs says how to make them)"
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ffmpeg for the probe clip
        if: inputs.action == 'probe'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: ${{ inputs.action }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          ONLY: ${{ inputs.only }}
          KINDS: ${{ inputs.kinds }}
          MAX: ${{ inputs.max }}
          PRIVACY: ${{ inputs.privacy }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          EVERY_HOURS: ${{ inputs.every_hours }}
          DRY: ${{ inputs.dry }}
          REPLACE: ${{ inputs.replace }}
          SET: ${{ inputs.set }}
          NARRATOR: ${{ vars.NARRATOR }}  # empty: the channel's voice from src/config.mjs
        run: |
          set -o pipefail
          args=("$ACTION")
          # schedule and withdraw name their own releases and need them all loaded, so only does not narrow them.
          [ -n "$ONLY" ] && [ "$ACTION" != "schedule" ] && [ "$ACTION" != "withdraw" ] && args+=(--only "$ONLY")
          [ "$DRY" = "true" ] && [ "$ACTION" != "list" ] && [ "$ACTION" != "probe" ] && args+=(--dry)
          if [ "$ACTION" = "upload" ]; then
            args+=(--kinds "$KINDS" --max "$MAX" --privacy "$PRIVACY")
            [ -n "$PUBLISH_AT" ] && args+=(--publish-at "$PUBLISH_AT" --every "${EVERY_HOURS:-0}")
            [ "$REPLACE" = "old-voice" ] && args+=(--replace-old-voice)
            if [ "$REPLACE" = "corrected" ]; then
              [ -n "$ONLY" ] || { echo 'replace=corrected needs only=<release>, the one whose render was corrected' >&2; exit 1; }
              args+=(--replace "$ONLY")
            fi
          fi
          if [ "$ACTION" = "schedule" ] || [ "$ACTION" = "withdraw" ]; then args+=(--set "$SET"); fi
          # The summary is written whatever the exit, so a failed run's page still says what was and was not done.
          rc=0
          node tools/youtube-channel.mjs "${args[@]}" 2>&1 | tee youtube.log || rc=$?
          { echo '## youtube: '"$ACTION"; echo; echo '```'; cat youtube.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the channel record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel
          path: brand/youtube/channel.json
          if-no-files-found: ignore
          retention-days: 30
