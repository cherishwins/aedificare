# The live sweep, from a clean runner with open egress.
#
# A deploy status is not a verification. This runs tools/verify.cjs against
# the production origin over the real network: every page, ten viewports,
# all eleven probes, plus the headers and crawl files. On demand, so it can
# be fired right after a deploy; free, because the repo is public.
name: verify-live

on:
  workflow_dispatch:
    inputs:
      url:
        description: Origin to sweep
        default: https://aedificare.art
        required: true
      sha:
        description: Commit expected live (blank = this ref's head)
        default: ''
        required: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (CI only)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Headers and crawl files
        run: |
          set -e
          U="${{ github.event.inputs.url }}"
          for p in / /ns-01 /ns-02 /robots.txt /llms.txt /llms-full.txt /feed.xml /sitemap-index.xml /ai.txt /humans.txt /site.webmanifest /favicon.svg /pdf/ns-02.pdf; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$U$p"); echo "$code $p"; [ "$code" = "200" ]
          done
          echo "--- headers on /"; curl -sSI "$U/" | grep -iE "^(server|link|x-content-type-options|referrer-policy):"
          echo "--- canonical on /ns-02"; curl -sS "$U/ns-02" | grep -oE 'rel="canonical" href="[^"]*"'
          echo "--- drafts hidden"
          for d in $(node -e "const {EDITIONS}=await import('./src/lib/editions.mjs');console.log(EDITIONS.filter(e=>e.draft).map(e=>e.path).join(' '))" --input-type=module); do
            echo "$d $(curl -sS "$U$d" | grep -oE 'name="robots" content="[^"]*"')"
            curl -sS "$U$d" | grep -q 'content="noindex' || { echo "NOT noindex: $d"; exit 1; }
            test "$(curl -sS "$U/sitemap-0.xml" | grep -c "<loc>[^<]*$d</loc>")" = "0"
          done
          echo "--- one URL per page"
          code=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" "$U/ns-02/"); echo "/ns-02/ -> $code"; [ "$code" = "308 $U/ns-02" ]
          code=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" "$U/sitemap.xml"); echo "/sitemap.xml -> $code"; [ "$code" = "308 $U/sitemap-index.xml" ]
          # vercel.json names production in a PDF's canonical whatever host serves it, so the check reads it from src/config.mjs.
          P=$(node --input-type=module -e "const {PRODUCTION_ORIGIN}=await import('./src/config.mjs');console.log(PRODUCTION_ORIGIN)")
          curl -sSI "$U/pdf/ns-02.pdf" | grep -i "^link:" | grep -qF "<$P/ns-02>; rel=\"canonical\"" || { echo "no canonical on /pdf/ns-02.pdf"; exit 1; }
      - name: Which commit is live
        run: |
          set -e
          U="${{ github.event.inputs.url }}"
          want="${{ github.event.inputs.sha || github.sha }}"; want="${want:0:8}"
          live=$(curl -sS "$U/" | grep -oE 'name="build" content="[^"]*"' | sed -E 's/.*content="([^"]*)".*/\1/')
          echo "live build: ${live:-none}   expected: $want"
          [ "$live" = "$want" ]
      - name: Sweep
        run: node tools/verify.cjs --url "${{ github.event.inputs.url }}"
