# Listening samples for choosing the channel's voice (tools/voice-samples.mjs):
# the same 45-second passage read by the current voice (Kokoro am_michael, the
# control) and by Gemini 3.8 Flash TTS voices, prebuilt and designed. Files
# them under the Release `voice-samples`, replacing the last set, so the owner
# listens from the Releases page and the builder can fetch them.
#
# Needs the repository secret GEMINI_API_KEY (an AI Studio key on the owner's
# Google Cloud project) and, for the ElevenLabs sample, ELEVENLABS_API_KEY;
# without them only the control is made. `only` picks engines, so one engine
# can be tried without spending another's quota.
name: voice-samples

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which engines: kokoro,gemini,eleven (any subset)'
        required: false
        default: 'kokoro,gemini,eleven'

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: ffmpeg, espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The paid account's key is stored as PLUTO (the owner's name for it, 2026-10-17).
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.PLUTO }}
          ELEVENLABS_API_KEY_TEST: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
          ONLY: ${{ inputs.only || 'kokoro,gemini,eleven' }}
        run: node tools/voice-samples.mjs --out out --only "$ONLY"

      - name: File them as the Release voice-samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voice-samples >/dev/null 2>&1 || gh release create voice-samples --title 'Voice samples' --notes 'Listening samples for choosing the narrator voice. See index.txt.'
          for f in out/*.mp3 out/index*.txt; do gh release upload voice-samples "$f" --clobber; done
          { echo '## Voice samples'; echo; echo '```'; cat out/index*.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
