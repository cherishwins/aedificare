# The filing system for films. A GitHub Release per edition, named
# film-<slug>, holding the film, the Short, captions, sheets, meta and the
# thumbnail as assets: permanent (Actions artifacts expire in 90 days),
# one URL per file, up to 2 GB each, free on a public repository, listed
# under the repo's Releases tab where the owner can find and download
# them without opening a workflow run. Each new render replaces the assets
# of the same release, so film-edition-03 always holds the latest cut and
# the release notes are the latest upload sheet.
#
# Called by film.yml after a render, and dispatchable by hand with the slug
# and the run id of any finished film run, to file a render that predates
# this workflow.
#
# Every fresh render is also filed under base names, <slug>-film-base-1920x1080.mp4 and
# <slug>-short-base-1080x1920.mp4, which nothing else writes, with the voice
# alone as narration.flac (the artifact that holds narration.wav lasts 90
# days). The re-cut (recut.yml, tools/cuts.mjs) composes over those, pinned by
# sha256 in its cut list: because each upload here clobbers, a re-cut filed
# under the usual names and then cut again would have composed over itself,
# its pops and sound doubled. With recut: true this files a re-cut: the usual
# names and cuts.json, and never a base file or the stem. A fresh render
# removes a cuts.json left by an earlier re-cut, whose credits it does not carry.
#
# GitHub refuses a release asset of 2 GiB or more (HTTP 422, "size must be
# less than 2147483648"). Found 2026-09-25 when The Snapshot Problem's film
# came out of an uncapped CRF 20 encode at 2.34 GB and the upload aborted,
# taking every later file with it. The encoder now caps the bitrate so a new
# render never gets there; this job still guards the door: files are
# uploaded one at a time so one failure cannot drop the rest, and a video at
# or over the limit is transcoded here to the same cap before upload.
name: release

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      run_id:
        required: true
        type: string
      artifact:
        description: 'The artifact to file; empty for film-<slug>-wide'
        type: string
        default: ''
      recut:
        description: 'The artifact is a re-cut (recut.yml): never file a base file or the stem'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      slug:
        description: 'Edition slug'
        required: true
        default: edition-03
      run_id:
        description: 'A finished film workflow run id whose artifact to file'
        required: true
      artifact:
        description: 'The artifact to file; empty for film-<slug>-wide'
        required: false
        default: ''
      recut:
        description: 'The artifact is a re-cut (recut.yml)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ inputs.slug }}
      GH_TOKEN: ${{ github.token }}
      RECUT: ${{ inputs.recut && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact || format('film-{0}-wide', inputs.slug) }}
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      # A video at or over GitHub's 2 GiB asset limit is re-encoded to the same
      # 8 Mbps cap the encoder now applies (tools/lib/film.mjs); the audio is
      # copied untouched. ffmpeg is installed only when that happens.
      - name: Fit any oversize video under the asset limit
        run: |
          set -e
          LIMIT=2147483648
          shopt -s nullglob
          for f in out/*.mp4; do
            size=$(stat -c %s "$f")
            if [ "$size" -ge "$LIMIT" ]; then
              echo "::warning::$f is $size bytes, over the 2 GiB asset limit; re-encoding at 8 Mbps"
              command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
              ffmpeg -hide_banner -loglevel error -y -i "$f" -c:v libx264 -preset medium -crf 20 -maxrate 8M -bufsize 16M -pix_fmt yuv420p -movflags +faststart -c:a copy "$f.fit.mp4"
              mv "$f.fit.mp4" "$f"
              echo "now $(stat -c %s "$f") bytes"
            fi
          done

      - name: File the release
        run: |
          set -e
          ls -la out
          shopt -s nullglob
          if [ "$RECUT" = yes ]; then
            # A re-cut names its cut list in meta.json and files its manifest beside it, and never a clean file.
            jq -e '.recut' out/meta.json >/dev/null && [ -f out/cuts.json ] || { echo "::error::a re-cut's meta.json names its cut list (recut) and cuts.json stands beside it"; exit 1; }
            for f in out/*-base-*.mp4 out/*.flac; do echo "::error::a re-cut never files $f"; exit 1; done
          else
            # A fresh render is the clean film: filed under the base names too, hard links so nothing is copied.
            for k in film:1920x1080 short:1080x1920; do
              f="out/$SLUG-${k%%:*}-${k#*:}.mp4"
              if [ -f "$f" ]; then ln -f "$f" "out/$SLUG-${k%%:*}-base-${k#*:}.mp4"; fi
            done
          fi
          TITLE="$(jq -r .title out/meta.json 2>/dev/null || echo "$SLUG")"
          TAG="film-$SLUG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "Film of /$SLUG. Assets replaced on every render; notes are the latest upload sheet." --latest=false
          fi
          gh release edit "$TAG" --title "$TITLE" --notes-file out/sheet.txt
          # One file per call, so a refused file is one missing asset and not an empty release.
          FAILED=()
          for f in out/*.mp4 out/*.srt out/*.txt out/*.json out/*.png out/*.md out/*.flac; do
            case "$f" in out/meta.json|out/meta-short.json) continue ;; esac
            gh release upload "$TAG" "$f" --clobber || FAILED+=("$f")
          done
          # The meta files last, and only over a complete set: film-queue.yml reads meta.json as "this edition is
          # filed", so it must never stand beside a film that failed to upload.
          if [ "${#FAILED[@]}" -eq 0 ]; then
            for f in out/meta.json out/meta-short.json; do
              gh release upload "$TAG" "$f" --clobber || FAILED+=("$f")
            done
          fi
          # A fresh render carries no re-cut's credits: a cuts.json left beside it would be read as if it did.
          if [ "$RECUT" != yes ] && [ "${#FAILED[@]}" -eq 0 ] && gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx cuts.json; then
            gh release delete-asset "$TAG" cuts.json -y
          fi
          echo "Filed under https://github.com/${{ github.repository }}/releases/tag/$TAG"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
          if [ "${#FAILED[@]}" -gt 0 ]; then echo "::error::not uploaded: ${FAILED[*]}"; exit 1; fi
